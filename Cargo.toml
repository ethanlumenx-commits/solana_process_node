[package]
name = "solana_process_node"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
# WebSocket
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
# bytes = "1.6"
# skip-list = "0.1.3"
# bincode = "1.3"

anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"